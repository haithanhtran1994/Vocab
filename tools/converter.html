<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel → vocab.json Converter</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
  :root{--primary:#2563eb;--success:#16a34a;--danger:#ef4444;--warning:#ca8a04;--bg:#f1f5f9}
  html,body{margin:0;background:var(--bg);font-family:'Segoe UI',Arial,sans-serif}
  body{display:flex;justify-content:center;padding:24px 12px}
  .wrap{width:100%;max-width:820px}
  .card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 10px 15px -3px rgba(0,0,0,.1);margin-bottom:20px}
  h1{font-size:1.3rem;margin:0 0 4px 0;color:#1e293b}
  .sub{color:#64748b;font-size:.9rem;margin-bottom:20px}
  .drop{border:2px dashed #cbd5e1;border-radius:12px;padding:36px 20px;text-align:center;cursor:pointer;transition:.15s}
  .drop.drag{background:#eff6ff;border-color:var(--primary)}
  .drop input{display:none}
  .drop p{margin:6px 0;color:#64748b}
  .drop .big{font-size:2rem}
  .btn{padding:12px 20px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:.95rem}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-success{background:var(--success);color:#fff}
  .btn-secondary{background:#64748b;color:#fff}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .stat{display:inline-flex;align-items:center;gap:6px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:.85rem;color:#334155}
  .stat b{color:var(--primary)}
  .msg{border-radius:10px;padding:12px 14px;font-size:.85rem;margin-top:12px;line-height:1.6;white-space:pre-wrap}
  .msg.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
  .msg.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
  .msg.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
  table{border-collapse:collapse;width:100%;font-size:.8rem;margin-top:12px}
  th,td{border:1px solid #e2e8f0;padding:6px 8px;text-align:left}
  th{background:#f1f5f9}
  .preview-wrap{overflow:auto;max-height:320px;border:1px solid #e2e8f0;border-radius:8px}
  .tag{display:inline-block;font-size:.65rem;background:#6366f1;color:#fff;padding:2px 6px;border-radius:4px;margin-left:4px;font-weight:bold}
  textarea{width:100%;box-sizing:border-box;height:160px;font-family:monospace;font-size:.75rem;border:1px solid #cbd5e1;border-radius:8px;padding:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>📥 Excel Template → vocab.json</h1>
    <div class="sub">Đọc file Excel (theo Vocab_Template.xlsx) và tạo ra file <code>vocab.json</code> đúng chuẩn cho app học từ vựng. Xử lý hoàn toàn trong trình duyệt, không upload đi đâu cả.</div>
    <label class="drop" id="drop">
      <input type="file" id="fileInput" accept=".xlsx">
      <div class="big">📄</div>
      <p><b>Nhấn để chọn file</b> hoặc kéo-thả file .xlsx vào đây</p>
      <p id="fileName" style="font-weight:bold;color:#1e293b"></p>
    </label>
  </div>

  <div class="card hidden" id="resultCard">
    <h1>Kết quả</h1>
    <div class="row" id="statsRow"></div>
    <div id="messages"></div>
    <div class="row" style="margin-top:18px">
      <button class="btn btn-success" id="btnDownload">💾 Tải vocab.json</button>
      <button class="btn btn-secondary" id="btnPreview">👁️ Xem trước JSON</button>
      <button class="btn btn-secondary" id="btnReset">🔄 Chọn file khác</button>
    </div>
    <div id="previewBox" class="hidden" style="margin-top:14px">
      <textarea id="previewText" readonly></textarea>
    </div>
  </div>

  <div class="card hidden" id="tableCard">
    <h1>Xem trước bảng "vocab" <span id="tableCount" class="tag"></span></h1>
    <div class="preview-wrap"><table id="previewTable"></table></div>
  </div>
</div>

<script>
// ── Cùng logic parse với app chính (js/dbview.js -> parseXlsxWorkbook) ──
// để đảm bảo file JSON sinh ra tương thích 100% với app.
function cleanStr(s) { return String(s == null ? '' : s).replace(/\\n/g, '\n'); }

function parseXlsxWorkbook(wb) {
  const warnings = [];
  const sheetNames = wb.SheetNames;
  const vocabSN = sheetNames.find(n => n.toLowerCase() === 'vocab') || sheetNames[0];
  if (!sheetNames.find(n => n.toLowerCase() === 'vocab')) {
    warnings.push(`⚠️ Không tìm thấy sheet tên "vocab" — dùng tạm sheet đầu tiên ("${vocabSN}") làm bảng từ vựng chính.`);
  }
  const rawRows = XLSX.utils.sheet_to_json(wb.Sheets[vocabSN], { defval: 'N.A' });
  if (!rawRows.length) throw new Error(`Sheet "${vocabSN}" trống, không có dữ liệu để chuyển đổi.`);
  const headers = Object.keys(rawRows[0]);
  const rows = rawRows
    .map(row => { let o = {}; headers.forEach(h => { o[h] = cleanStr(row[h]); }); return o; })
    // bỏ các dòng trống hoàn toàn (kể cả dòng ghi chú cuối template)
    .filter(o => Object.values(o).some(v => v !== '' && v !== 'N.A'));

  // kiểm tra STT trùng / rỗng
  const sttKey = headers[0];
  const seenStt = new Set(); const dupStt = new Set(); let emptyCount = 0;
  rows.forEach(r => {
    const v = String(r[sttKey] || '').trim();
    if (!v) { emptyCount++; return; }
    if (seenStt.has(v)) dupStt.add(v); else seenStt.add(v);
  });
  if (emptyCount) warnings.push(`⚠️ Có ${emptyCount} dòng thiếu "${sttKey}" (mã số) trong sheet "${vocabSN}".`);
  if (dupStt.size) warnings.push(`⚠️ "${sttKey}" bị trùng ở các giá trị: ${[...dupStt].join(', ')}. Mỗi từ nên có mã số duy nhất.`);

  const sheets = {};
  sheetNames.forEach(sn => {
    if (sn === vocabSN) return;
    if (sn.toLowerCase() === 'huongdan') return; // bỏ qua sheet hướng dẫn
    const rr = XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval: '' });
    if (!rr.length) return;
    const keys = Object.keys(rr[0]);
    const find = c => keys.find(k => c.includes(k.toLowerCase().trim())) || keys[0];
    const findOptional = c => keys.find(k => c.includes(k.toLowerCase().trim())) || null;
    const cm = {
      stt: find(['stt', 'id', 'no', 'số']),
      idx: find(['idx', 'index']),
      jp: find(['jp', 'japanese', 'ja', 'kanji', 'từ']),
      vi: find(['vi', 'vietnamese', 'vn', 'nghĩa', 'nghia', 'meaning', 'dịch']),
      audio: findOptional(['audio', 'mp3', 'wav', 'sound', 'âm thanh'])
    };
    let lastStt = ''; const items = [];
    rr.forEach(r => {
      const rawStt = r[cm.stt];
      const stt = (rawStt === null || rawStt === undefined || rawStt === '') ? lastStt : String(rawStt);
      if (stt) lastStt = stt;
      const jp = cleanStr(r[cm.jp]), vi = cleanStr(r[cm.vi]);
      const audio = cm.audio ? cleanStr(r[cm.audio]) : '';
      if (stt || jp) items.push({ stt, idx: r[cm.idx] || '', jp, vi, audio });
    });
    if (items.length) sheets[sn] = items;
  });

  // cảnh báo: câu ví dụ trỏ tới STT không tồn tại trong vocab
  Object.entries(sheets).forEach(([sn, items]) => {
    const orphan = items.filter(it => it.stt && !seenStt.has(String(it.stt)));
    if (orphan.length) warnings.push(`⚠️ Sheet "${sn}" có ${orphan.length} dòng với mã số không khớp từ nào trong "${vocabSN}" (${[...new Set(orphan.map(o=>o.stt))].slice(0,10).join(', ')}${orphan.length>10?'...':''}).`);
  });

  return { data: { headers, rows, sheets }, warnings, vocabSN, sheetCount: Object.keys(sheets).length };
}

// ── UI wiring ──
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
let resultData = null;

['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) handleFile(f); });
fileInput.addEventListener('change', e => { const f = e.target.files[0]; if (f) handleFile(f); });

function handleFile(file) {
  if (!/\.xlsx$/i.test(file.name)) { alert('Chỉ hỗ trợ file .xlsx'); return; }
  document.getElementById('fileName').innerText = '📎 ' + file.name;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const result = parseXlsxWorkbook(wb);
      resultData = result.data;
      showResult(result);
    } catch (err) {
      showError(err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function showResult(result) {
  document.getElementById('resultCard').classList.remove('hidden');
  document.getElementById('tableCard').classList.remove('hidden');
  document.getElementById('previewBox').classList.add('hidden');

  const statsRow = document.getElementById('statsRow');
  statsRow.innerHTML = `
    <span class="stat">Sheet chính: <b>${result.vocabSN}</b></span>
    <span class="stat">Số từ: <b>${result.data.rows.length}</b></span>
    <span class="stat">Số cột: <b>${result.data.headers.length}</b></span>
    <span class="stat">Sheet phụ: <b>${result.sheetCount}</b></span>`;

  const msgBox = document.getElementById('messages');
  msgBox.innerHTML = '';
  if (result.warnings.length) {
    const div = document.createElement('div');
    div.className = 'msg warn';
    div.innerText = result.warnings.join('\n');
    msgBox.appendChild(div);
  } else {
    const div = document.createElement('div');
    div.className = 'msg ok';
    div.innerText = '✅ Không phát hiện lỗi/cảnh báo nào. Dữ liệu hợp lệ.';
    msgBox.appendChild(div);
  }

  // bảng xem trước (tối đa 50 dòng đầu)
  document.getElementById('tableCount').innerText = `${result.data.rows.length} dòng`;
  const table = document.getElementById('previewTable');
  const headRow = '<tr>' + result.data.headers.map(h => `<th>${escapeHtml(h)}</th>`).join('') + '</tr>';
  const bodyRows = result.data.rows.slice(0, 50).map(r =>
    '<tr>' + result.data.headers.map(h => `<td>${escapeHtml(String(r[h] ?? ''))}</td>`).join('') + '</tr>'
  ).join('');
  table.innerHTML = headRow + bodyRows;

  document.getElementById('previewText').value = JSON.stringify(resultData, null, 2);
}

function showError(message) {
  document.getElementById('resultCard').classList.remove('hidden');
  document.getElementById('tableCard').classList.add('hidden');
  document.getElementById('statsRow').innerHTML = '';
  document.getElementById('messages').innerHTML = `<div class="msg err">❌ ${escapeHtml(message)}</div>`;
  resultData = null;
}

function escapeHtml(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

document.getElementById('btnDownload').addEventListener('click', () => {
  if (!resultData) { alert('Chưa có dữ liệu hợp lệ để tải.'); return; }
  const blob = new Blob([JSON.stringify(resultData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'vocab.json'; a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('btnPreview').addEventListener('click', () => {
  document.getElementById('previewBox').classList.toggle('hidden');
});
document.getElementById('btnReset').addEventListener('click', () => {
  resultData = null;
  fileInput.value = '';
  document.getElementById('fileName').innerText = '';
  document.getElementById('resultCard').classList.add('hidden');
  document.getElementById('tableCard').classList.add('hidden');
});
</script>
</body>
</html>
